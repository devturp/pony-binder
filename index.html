<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pony Binder · MLP TCG Collection Tracker</title>
<meta name="description" content="Track your My Little Pony TCG collection across Fantasy Wonderland, Discord!!! and Nightmare Night.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="#" aria-label="Pony Binder home">
      <svg class="logo" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="4" y="3" width="24" height="33" rx="4" stroke="currentColor" stroke-width="2.5"/>
        <rect x="12" y="6" width="24" height="33" rx="4" fill="var(--accent)" stroke="currentColor" stroke-width="2.5"/>
        <path d="M24 13l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="var(--surface)"/>
      </svg>
      <span>Pony Binder</span>
    </a>
    <div class="profile" id="profileArea"></div>
  </div>
</header>

<div id="viewBanner" class="view-banner" hidden></div>

<p class="wrap" id="catalogStatus" role="status">Loading cards…</p>
<main class="wrap" id="binder" hidden>
  <section class="stats" id="stats" aria-label="Collection progress"></section>

  <section class="toolbar" aria-label="Filters">
    <div class="set-tabs" id="setTabs" role="tablist"></div>
    <div class="filters">
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search name or number" autocomplete="off">
      </label>
      <select id="rarity" aria-label="Rarity"></select>
      <select id="status" aria-label="Status">
        <option value="all">All cards</option>
        <option value="owned">Owned</option>
        <option value="missing">Missing</option>
        <option value="wish">Wishlist</option>
        <option value="trade">For trade</option>
      </select>
      <label class="toggle"><input type="checkbox" id="shining"> Shining only</label>
    </div>
  </section>

  <p class="count" id="count"></p>
  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<footer class="wrap foot">
  <p>Your collection is saved in this browser only. Use <b>Backup</b> to save a file, or <b>Share</b> to send friends a view-only link.</p>
  <p>Card list and images courtesy of the <a href="https://data.mlpmerch.com/kayou-cards/series/trading-card-game/booster-pack/" target="_blank" rel="noopener">MLP Merch Kayou Card Database</a>. Fan-made tool, not affiliated with Hasbro or KAYOU.</p>
</footer>

<dialog id="cardDlg" class="dlg card-dlg"></dialog>
<dialog id="menuDlg" class="dlg"></dialog>
<div id="toast" class="toast" role="status"></div>

<script type="module" src="app.js"></script>
</body>
</html>
